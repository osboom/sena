<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencias</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* Estilos personalizados */
        .btn-custom {
            background-color: #39A900;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #2e8a00;
            color: white;
        }

        .title-color {
            color: #39A900;
        }

        /* Placeholder styling */
        ::placeholder {
            font-size: 0.85rem;
            text-transform: capitalize;
            color: #999;
        }

        .req-star {
            color: red;
            font-weight: bold;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Modifica tu script al final del body -->
    <script>
        // 1. Inicializa Supabase
        const supabaseUrl = 'https://ueatzeyfeaxwqocwpjlf.supabase.co';
        const supabaseKey = 'sb_publishable_92N7Af11eReV6nmKLI6riw_-my4wLOQ';
        const supabase = supabaseClient.createClient(supabaseUrl, supabaseKey);

        const form = document.querySelector('form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // 2. Captura los datos
            const formData = {
                Institucion: document.getElementById('Institucion').value,
                Nombre: document.getElementById('Nombre').value,
                Cargo: document.getElementById('Cargo').value,
                Celular: document.getElementById('Celular').value,
                Email: document.getElementById('Email').value
            };

            // 3. Enviar a Supabase
            const { data, error } = await supabase
                .from('asistenciaZode')
                .insert([formData]);

            if (error) {
                alert('Error al enviar: ' + error.message);
            } else {
                alert('¡Registro enviado con éxito!');
                form.reset();
            }
        });
    </script>
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Sección de Encabezado Dividido en 2 Partes -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body p-3">
                        <div class="row align-items-center">
                            <!-- Parte Izquierda: Imagen -->
                            <div class="col-4 text-center">
                                <img src="logosena2.png" alt="Logo SENA" class="img-fluid" style="max-height: 80px;">
                            </div>
                            <!-- Parte Derecha: Textos -->
                            <div class="col-8">
                                <h5 class="fw-bold mb-1 title-color">Regional Bolivar</h5>
                                <h6 class="fw-bold mb-0 title-color">Centro Agroempresarial y Minero</h6>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Formulario -->
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 title-color">Registro de Asistencia</h2>

                        <form class="needs-validation" novalidate>

                            <!-- Institucion -->
                            <div class="mb-3">
                                <label class="form-label">Institucion <span class="req-star">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-house-door"></i></span>
                                    <input type="text" class="form-control" id="Institucion"
                                        placeholder="Institucion Educativa" list="lista-instituciones" required
                                        autocomplete="off">
                                </div>
                                <datalist id="lista-instituciones"></datalist>
                            </div>

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label class="form-label">Nombre <span class="req-star">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" id="Nombre" class="form-control"
                                        placeholder="Nombre del Participante" required>
                                </div>
                            </div>

                            <!-- Cargo -->
                            <div class="mb-3">
                                <label class="form-label">Cargo <span class="req-star">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-grid"></i></span>
                                    <input type="text" class="form-control" id="Cargo" placeholder="Cargo"
                                        list="lista-cargos" required autocomplete="off">
                                </div>
                                <datalist id="lista-cargos"></datalist>
                            </div>

                            <!-- Celular -->
                            <div class="mb-3">
                                <label class="form-label">Celular <span class="req-star">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-phone-vibrate"></i></span>
                                    <input type="tel" id="Celular" class="form-control" placeholder="Numero de Celular"
                                        pattern="[0-9]{10}" required>
                                </div>
                            </div>

                            <!-- Email con validación -->
                            <div class="mb-3">
                                <label class="form-label">Email <span class="req-star">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope-at"></i></span>
                                    <input type="email" class="form-control" id="Email" placeholder="Correo Electronico"
                                        required>
                                </div>
                                <div class="invalid-feedback">Por favor ingrese un correo válido.</div>
                            </div>

                            <!-- Campos obligatorios -->
                            <div class="mb-3">
                                <small class="text-muted"><span class="req-star">*</span> Campos obligatorios</small>
                            </div>

                            <!-- Botón Enviar -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-custom btn-lg">Enviar Registro</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const instituciones = [
            "INSTITUCION EDUCATIVA TECNICA AGROINDUSTRIAL REPUBLICA DE COLOMBIA",
            "INSTITUCIÓN EDUCATIVA TECNICA AGROPECUARIA  DE  SINCERIN",
            "INSTITUCION EDUCATIVA TECNICA EN ARTES Y OFICIOS MARIA MICHELSEN DE LOPEZ",
            "INSTITUCIÓN EDUCATIVA TECNICA AGROPECUARIA Y ACUÍCOLA PUERTO BADEL",
            "INSTITUCION EDUCATIVA TECNICA DE ARROYOHONDO ROBERTO BOTERO MORALES",
            "INSTITUCION EDUCATIVA TECNICA AGROINDUSTRIAL DE CALAMAR",
            "INSTITUCIÓN EDUCATIVA TECNICA AGROPECUARIA  DE EL YUCAL",
            "INSTITUCIÓN EDUCATIVA TECNICA AGROPECUARIA  JOSE ANTONIO GALAN",
            "INSTITUCION EDUCATIVA DE BAYUNCA",
            "COLEGIO NUESTRA SEÑORA DE FATIMA DE LA POLICIA NACIONAL",
            "INSTITUCION EDUCATIVA TECNICO AGROPUECUARIA SAN JOSE DE CLEMENCIA",
            "INSTITUCION EDUCATIVA TECNICA AGROINDUSTRIAL DE MALAGANA",
            "INSTITUCIÓN EDUCATIVA  TECNICA AGROPECUARIA EZEQUIEL MARTELO PIMIENTA DE SAN JOAQUIN",
            "INSTITUCION EDUCATIVA TECNICA AGROPECUARIA BENKOS BIOHO DE SAN BASILIO DE PALENQUE",
            "INSTITUCIÓN EDUCATIVA TECNICA AGROPECUARIA LAZARO MARTINEZ OLIER",
            "INSTITUCION EDUCATIVA TECNICA AGROPECUARIA FRANCISCO DE PAULA SANTANDER HIGUERETAL",
            "INSTITUCION EDUCATIVA TECNICA AGROPECUARIA LAS PIEDRAS",
            "INSTITUCIÓN EDUCATIVA TECNICA AGROPECUARIA  SOSTENIBLE Y AMBIENTAL FELIPE SANTIAGO ESCOBAR",
            "INSTITUCIÓN EDUCATIVA TECNICA AGROPECUARIA NUESTRA SEÑORA DEL CARMEN",
            "INSTITUCIÓN EDUCATIVA SANTA ROSA DE LIMA",
            "INSTITUCIÓN EDUCATIVA TECNICA AGROPECUARIA LA BUENA ESPERANZA",
            "INSTITUCION EDUCATIVA  DOCENTE DE TURBACO",
            "INSTITUCION EDUCATIVA TECNICO INDUSTRIAL DE TURBANA",
            "INSTITUCIÒN EDUCATIVA MARCO FIDEL SUAREZ",
            "INSTITUCIÓN EDUCATIVA TECNICA AGROPECUARIA DE VILLANUEVA",
            "INSTITUCION EDUCATIVA TECNICA INDUSTRIAL MOISES CABEZA JUNCO"
        ];

        const cargos = [
            "COORDINADOR",
            "COORDINADOR ACADEMICO",
            "COORINADOR ENCARGADO",
            "DOCENTE",
            "DOCENTE DE AULA",
            "DOCENTE TECNICO",
            "RECTOR",
            "TECNICO",
            "TECNICO AGRICOLA"
        ];

        // Lógica de Autocompletado Institucion (>= 3 chars)
        const inputInstitucion = document.getElementById('institucion');
        const dataListInstituciones = document.getElementById('lista-instituciones');
        inputInstitucion.addEventListener('input', function () {
            dataListInstituciones.innerHTML = this.value.length >= 3 ? instituciones.filter(i => i.toLowerCase().includes(this.value.toLowerCase())).map(i => `<option value="${i}">`).join('') : '';
        });

        // Lógica de Autocompletado Cargo (>= 2 chars)
        const inputCargo = document.getElementById('cargo');
        const dataListCargos = document.getElementById('lista-cargos');
        inputCargo.addEventListener('input', function () {
            dataListCargos.innerHTML = this.value.length >= 2 ? cargos.filter(c => c.toLowerCase().includes(this.value.toLowerCase())).map(c => `<option value="${c}">`).join('') : '';
        });

        // Validación Email (blur)
        document.getElementById('email').addEventListener('blur', function () {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (this.value && !emailRegex.test(this.value)) {
                this.classList.add('is-invalid');
            } else {
                this.classList.remove('is-invalid');
            }
        });

        // Bootstrap validación
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })();
    </script>
</body>

</html>
