<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Exitoso - Asistencia</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* Estilos personalizados heredados del index */
        .btn-custom {
            background-color: #39A900;
            color: white;
            border: none;
            padding: 10px 24px;
            font-weight: 500;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-custom:hover {
            background-color: #2e8a00;
            color: white;
        }

        .title-color {
            color: #39A900;
        }

        /* Estilos específicos para la confirmación */
        .success-icon {
            font-size: 4rem;
            color: #39A900;
            line-height: 1;
        }

        .success-card {
            background-color: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: 12px;
            padding: 2rem 1.5rem;
        }

        .highlight-text {
            color: #15803d;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.6;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Sección de Encabezado Dividido en 2 Partes (Conservado del index) -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body p-3">
                        <div class="row align-items-center">
                            <!-- Parte Izquierda: Imagen -->
                            <div class="col-4 text-center">
                                <img src="logosena2.png" alt="Logo SENA" class="img-fluid" style="max-height: 80px;">
                            </div>
                            <!-- Parte Derecha: Textos -->
                            <div class="col-8">
                                <h5 class="fw-bold mb-1 title-color">Regional Bolívar</h5>
                                <h6 class="fw-bold mb-0 title-color">Centro Agroempresarial y Minero</h6>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tarjeta de Confirmación de Registro -->
                <div class="card shadow-sm">
                    <div class="card-body p-4 text-center">
                        
                        <div class="mb-3">
                            <i class="bi bi-check-circle-fill success-icon"></i>
                        </div>

                        <h2 class="fw-bold mb-4 title-color">¡Registro Exitoso!</h2>

                        <!-- Div destacado con el mensaje -->
                        <div class="success-card mb-4 shadow-sm">
                            <p class="highlight-text mb-0">
                                Se registró satisfactoriamente, muchas gracias por asistir al evento de 
                                <strong>Actualización Pedagógica de Zodes Dique</strong>.
                            </p>
                        </div>

                        <!-- Botón opcional para regresar al inicio o registrar a otra persona -->
                        <div class="d-grid gap-2 col-md-10 mx-auto mt-4">
                            <a href="index.html" class="btn btn-custom btn-lg shadow-sm">
                                <i class="bi bi-arrow-left-circle me-2"></i>Registrar otra asistencia
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
